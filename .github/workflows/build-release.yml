# ==============================================================================
# 报工服务器（baogong-server）· GitHub Actions 工作流
#
# 能力对齐原极狐 GitLab 流水线（.gitlab-ci.yml）：
#   check   → PHP 语法检查 + 工程结构校验
#   build   → 构建 release APK + 热更新 zip
#   release → 打 v* tag 时创建 GitHub Release 并挂载产物
#
# 与原流水线的差异（因平台不同，刻意简化）：
#   1. 用 GitHub 官方 ubuntu-latest runner，可直连 Google/Maven，
#      无需 GitLab 国内节点那套镜像/工具链下载脚本（ci/setup-android-toolchain.sh）。
#   2. 发布用 softprops/action-gh-release 直接上传 Release 资产，
#      不再需要 GitLab Generic Package Registry（那是私有仓库直链 401 的 workaround）。
#   3. 认证用 GitHub Secrets + 内置 GITHUB_TOKEN，无 JOB-TOKEN / PRIVATE-TOKEN。
#
# 需要在仓库 Settings → Secrets and variables → Actions 配置 4 个 Secret（签名用）：
#   KEYSTORE_BASE64     release.jks 的 base64 内容
#   KEYSTORE_PASSWORD   密钥库口令
#   KEY_ALIAS           密钥别名
#   KEY_PASSWORD        密钥口令
# 未配置时 release 自动回退 debug 签名（apk 仍可安装，但无法覆盖正式版）。
# ==============================================================================

name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]          # 如 v2.3、v2.4，触发发布
  pull_request:
    branches: [ main ]
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: write           # 创建 Release / 上传资产所需

jobs:
  # ============================================================================
  # 阶段一：检查
  # ============================================================================
  check:
    name: PHP 语法 & 结构检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 PHP（用于语法检查）
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli

      - name: PHP 语法检查（assets 内全部 PHP）
        run: |
          set -e
          fail=0; count=0
          while IFS= read -r f; do
            count=$((count + 1))
            php -l "$f" || fail=1
          done < <(find app/src/main/assets/baogong -name '*.php' | sort)
          echo "共检查 $count 个 PHP 文件"
          [ "$fail" -eq 0 ] || { echo "存在 PHP 语法错误"; exit 1; }

      - name: 关键文件与目录校验
        run: |
          set -e
          missing=0
          for f in \
            app/src/main/assets/baogong/public/api.php \
            app/src/main/assets/baogong/public/app.js \
            app/src/main/assets/baogong/public/index.html \
            app/src/main/jniLibs/arm64-v8a/libphp_bin.so \
            app/src/main/AndroidManifest.xml \
            app/build.gradle \
            build.gradle \
            settings.gradle ; do
            if [ -e "$f" ]; then echo "  OK   $f"; else echo "  MISS $f"; missing=1; fi
          done
          echo "PHP 运行时 .so 数量：$(ls app/src/main/jniLibs/arm64-v8a/*.so 2>/dev/null | wc -l)"
          [ "$missing" -eq 0 ] || { echo "关键文件缺失"; exit 1; }

  # ============================================================================
  # 阶段二：构建
  # ============================================================================
  build:
    name: 构建 APK + 热更新包
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Android platform 35 / build-tools 35.0.0
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: 准备正式签名（从 Secrets 还原，未配置则跳过）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash ci/prepare-signing.sh

      - name: 赋予 Gradle 执行权限
        run: chmod +x ./gradlew

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 构建 release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: 打热更新 zip
        run: bash ci/package-hotupdate.sh

      - name: 汇总产物到 dist/
        run: |
          set -e
          version=$(sed -n 's/.*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -1)
          for f in app/build/outputs/apk/release/*.apk; do
            [ -e "$f" ] || continue
            cp "$f" "dist/baogong-server-${version}-arm64.apk"
          done
          echo "产物清单："
          ls -lh dist/

      - name: 上传构建产物（artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: baogong-dist
          path: dist/
          retention-days: 90

  # ============================================================================
  # 阶段三：发布（仅 v* tag 触发）
  # ============================================================================
  release:
    name: 发布 GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: baogong-dist
          path: dist/

      - name: 生成发布说明
        id: notes
        run: |
          {
            echo "## 报工服务器 ${GITHUB_REF_NAME}"
            echo
            echo "提交：\`${GITHUB_SHA::7}\`"
            echo
            echo "### 安装包"
            echo
            echo "- \`baogong-server-*-arm64.apk\` — 安卓 arm64 安装包，内置 PHP 运行时与报工系统程序。"
            echo
            echo "### 热更新包"
            echo
            echo "- \`baogong-public-*.zip\` — 服务端 PHP 程序，zip 内文件位于根层级。"
            echo
            echo "用法见 [docs/03-热更新操作指南.md](docs/03-热更新操作指南.md)。"
            echo
            echo "> \`data/\`（数据库与图片）不在包内，更新不影响历史数据。"
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: 创建 Release 并上传资产
        uses: softprops/action-gh-release@v2
        with:
          name: 报工服务器 ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.apk
            dist/*.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
