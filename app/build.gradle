plugins {
    id 'com.android.application'
}

// 读取正式签名配置（keystore.properties 不入库，本地保管）
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.baogong.server'
    compileSdk 35

    defaultConfig {
        applicationId "com.baogong.server"
        minSdk 24
        targetSdk 34
        versionCode 14
        versionName "2.6"

        // 只打 arm64-v8a（目标是 arm64 真机，php 运行时也仅编译了 aarch64）
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    // 关键：让 jniLibs 里的 .so 在安装时【解压到 nativeLibraryDir 的真实文件】，
    // 而不是页对齐直接从 APK 映射。php 二进制需要被 exec，只有真实文件才可执行。
    // 对应 Manifest 里的 android:extractNativeLibs="true"（AGP 以本配置为准）。
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    signingConfigs {
        release {
            if (keystoreProperties['storeFile']) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // 有正式密钥时用正式签名；没有 keystore.properties 时（CI 未注入密钥）
            // 回退到 debug 签名，保证流水线仍能产出可安装的 APK。
            signingConfig keystoreProperties['storeFile'] ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
